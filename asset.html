<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Umang Creation — Asset Details">
  <meta name="theme-color" content="#050508">
  <title>Umang Creation — Asset Details</title>

  <!-- Favicon -->
  <link rel="icon" href="https://imgh.in/host/onzoec" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== BACKGROUND SKY ========== -->
  <div class="uiverse-midnight-sky">
    <div class="sky-canvas">
      <div class="stars stars-1"></div>
      <div class="stars stars-2"></div>
      <div class="stars stars-3"></div>
      <div class="meteor m1"></div>
      <div class="meteor m2"></div>
      <div class="meteor m3"></div>
      <div class="moon"></div>
    </div>
  </div>

  <!-- ========== HEADER ========== -->
  <header class="header" id="header">
    <a href="index.html" class="logo">
      <img src="https://imgh.in/host/onzoec" alt="Umang Creation Logo">
    </a>
    <a href="index.html" class="btn btn-outline btn-sm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
  </header>

  <!-- ========== ASSET CONTENT ========== -->
  <main class="project-page-container">
    <div class="project-back-btn-container">
      <a href="assets.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Assets
      </a>
    </div>

    <!-- Error message display if asset loading fails -->
    <div id="project-error-card" style="display:none;" class="about-card">
      <div style="text-align:center; padding: 3rem 1rem;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" width="48" height="48" style="margin-bottom:1rem;">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <h3>Asset not found</h3>
        <p style="color:var(--text-secondary); margin-bottom:1.5rem;">The asset you are looking for might have been deleted or the link is incorrect.</p>
        <a href="assets.html" class="btn btn-primary">Go to Assets</a>
      </div>
    </div>

    <!-- Skeleton Loading -->
    <div id="project-loading-skeleton" class="project-grid">
      <div class="project-media-col">
        <div class="skeleton" style="aspect-ratio:16/9; border-radius:var(--radius-md);"></div>
      </div>
      <div class="project-details-col" style="display:flex; flex-direction:column; gap:1.25rem;">
        <div class="skeleton" style="height:28px; width:100px;"></div>
        <div class="skeleton" style="height:48px; width:80%;"></div>
        <div class="skeleton" style="height:120px; width:100%;"></div>
      </div>
    </div>

    <!-- Real Content (hidden until loaded) -->
    <div id="project-content-grid" class="project-grid" style="display:none;">
      <!-- Left Column: Media Carousel -->
      <div class="project-media-col">
        <div class="viewer-carousel project-page-carousel">
          <div class="carousel-track">
            <div class="carousel-slides" id="project-carousel-slides">
              <!-- Dynamically populated -->
            </div>
          </div>
          <button class="carousel-arrow prev" id="carousel-prev-btn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="carousel-arrow next" id="carousel-next-btn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <div class="carousel-dots" id="project-carousel-dots">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Right Column: Details & Actions -->
      <div class="project-details-col">
        <div class="project-category-pill" id="project-category">Category</div>
        <h1 class="project-page-title" id="project-title">Asset Title</h1>
        
        <p class="project-page-desc" id="project-desc">Asset description goes here...</p>

        <!-- Designer details profile card -->
        <div class="designer-profile-card" id="designer-profile-section" style="display:none;">
          <img src="" alt="Designer Photo" class="designer-avatar" id="designer-photo">
          <div class="designer-info">
            <span class="designer-label">Designer</span>
            <span class="designer-name" id="designer-name">Designer Name</span>
          </div>
        </div>

        <!-- Dynamic Action CTA Section -->
        <div class="order-section" id="asset-cta-section" style="margin-top: 2rem;">
          <!-- Loaded dynamically based on asset type -->
        </div>

      </div>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="footer-brand">Umang Creation.</div>
    <p class="footer-copy">&copy; 2024 Umang Creation. All rights reserved.</p>
    <a href="#header" class="footer-top">
      Back to top
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </a>
  </footer>

  <!-- ========== SCRIPTS ========== -->
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/asset.js"></script>
</body>
</html>
