<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Umang Creation</title>

  <!-- Favicon -->
  <link rel="icon" href="https://imgh.in/host/onzoec" type="image/png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== HEADER (Hidden until logged in) ========== -->
  <header class="header" style="display:none;">
    <a href="index.html" class="logo">
      <img src="https://imgh.in/host/onzoec" alt="Logo">
    </a>
    <div style="display:flex;gap:8px;align-items:center;">
      <a href="index.html" class="btn btn-outline btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Site
      </a>
      <button id="admin-logout" class="btn btn-outline btn-sm" style="color:#ef4444;border-color:rgba(239,68,68,0.3);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </header>

  <!-- ========== LOGIN ========== -->
  <div class="admin-login">
    <div class="admin-login-card">
      <div style="margin-bottom:1.5rem;">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(124,58,237,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-light)" stroke-width="2" width="28" height="28">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </div>
        <h1>Admin Panel</h1>
        <p>Sign in to manage your projects</p>
      </div>

      <div class="admin-error" id="auth-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="your@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>


    </div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div class="admin-dash">
    <div class="admin-tabs">
      <button id="tab-projects" class="admin-tab active" onclick="switchAdminTab('projects')">Projects</button>
      <button id="tab-assets" class="admin-tab" onclick="switchAdminTab('assets')">Assets</button>
      <button id="tab-team" class="admin-tab" onclick="switchAdminTab('team')">Team</button>
    </div>
    <div class="admin-topbar">
      <h2 id="admin-section-title">Projects</h2>
      <button id="admin-add-btn" class="btn btn-primary btn-sm" onclick="openAddForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Project
      </button>
    </div>

    <div id="admin-projects-list">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <!-- ========== ADD/EDIT PROJECT FORM MODAL ========== -->
  <div class="admin-form-overlay">
    <div class="admin-form-card">
      <h3>New Project</h3>

      <form id="project-form">
        <div class="form-group">
          <label class="form-label" for="project-title">Title</label>
          <input type="text" id="project-title" class="form-input" placeholder="Project name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="project-category">Category</label>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <select id="project-category" class="form-input">
              <option value="">-- Select Category --</option>
              <option value="Graphic Design">Graphic Design</option>
              <option value="Banner Design">Banner Design</option>
              <option value="Photo Editing">Photo Editing</option>
              <option value="Video Editing">Video Editing</option>
              <option value="UI/UX Design">UI/UX Design</option>
              <option value="Social Media">Social Media</option>
              <option value="Branding">Branding</option>
              <option value="Motion Graphics">Motion Graphics</option>
              <option value="custom">Custom (Type below)...</option>
            </select>
            <input type="text" id="project-category-custom" class="form-input" placeholder="Enter custom category name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="project-description">Description</label>
          <textarea id="project-description" class="form-input" placeholder="Describe this project..." rows="4"></textarea>
        </div>

        <!-- Asset Only Fields -->
        <div class="form-group" id="asset-type-group" style="display:none;">
          <label class="form-label" for="asset-type">Asset Type</label>
          <select id="asset-type" class="form-input">
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="form-group" id="asset-download-group" style="display:none;">
          <label class="form-label" for="asset-download-url">Download URL</label>
          <input type="url" id="asset-download-url" class="form-input" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">Designers / Collaborators</label>
          <div id="collaborators-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:10px;">
            <!-- Dynamic collaborator input items -->
          </div>
          <button type="button" id="add-collaborator-btn" class="media-add-btn" style="margin-top:5px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Collaborator
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" for="project-thumbnail-url">Thumbnail URL (Optional)</label>
          <input type="url" id="project-thumbnail-url" class="form-input" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">Media (Images & Videos)</label>
          <div class="media-list" id="media-list">
            <!-- Dynamic media fields -->
          </div>
          <button type="button" id="add-media-btn" class="media-add-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Media
          </button>
        </div>

        <div class="admin-form-actions">
          <button type="button" class="btn-cancel" onclick="closeForm()">Cancel</button>
          <button type="submit" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== ADD/EDIT TEAM MEMBER FORM MODAL ========== -->
  <div class="admin-form-overlay team-form-overlay">
    <div class="admin-form-card">
      <h3 id="team-form-title">New Team Member</h3>
      <form id="team-form">
        <div class="form-group">
          <label class="form-label" for="team-name">Name</label>
          <input type="text" id="team-name" class="form-input" placeholder="Member's name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="team-photo">Photo URL</label>
          <input type="url" id="team-photo" class="form-input" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label class="form-label" for="team-dob">Date of Birth</label>
          <input type="date" id="team-dob" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="team-description">Description / Bio</label>
          <textarea id="team-description" class="form-input" placeholder="Bio description..." rows="3" required></textarea>
        </div>
        <div class="admin-form-actions">
          <button type="button" class="btn-cancel" onclick="closeTeamForm()">Cancel</button>
          <button type="submit" class="btn-save" id="team-save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== DELETE CONFIRMATION ========== -->
  <div class="confirm-overlay">
    <div class="confirm-card">
      <h4>Delete Project?</h4>
      <p>This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn-cancel" onclick="cancelDelete()">Cancel</button>
        <button class="btn-danger" onclick="executeDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div class="toast"></div>

  <!-- ========== SCRIPTS ========== -->
  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
